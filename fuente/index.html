<title>Temario STI SERMAS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c1214">
<meta name="description" content="Temario completo, legislación, test y simulacros de la oposición de Técnico Especialista STI del SERMAS.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Concepto: cuaderno de estudio de oposición. Barra lateral con el índice por bloques, área de trabajo con esquema subrayado con rotulador, tarjetas y test. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --sunk:#e7ede9; --ink:#14201b; --muted:#5a6a63; --line:#d3ddd8;
  --accent:#0a6b50; --accent-ink:#ffffff; --accent-soft:#d8ede4;
  --ok:#157347; --ok-soft:#ddf2e6; --bad:#b42f29; --bad-soft:#fbe4e2; --warn:#9a5b0b; --warn-soft:#fbeed8;
  --hl:#f5da6c; --hl-ink:#14201b;
  --c-leg:#6f45ad; --c-sis:#1d67a8; --c-red:#0b7f80; --c-dev:#b65d16; --c-bd:#7f6410; --c-seg:#ad2f46; --c-san:#2a7f39;
  --f-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-b:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px; --side:300px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --sunk:#1c2723; --ink:#e3ebe7; --muted:#93a49d; --line:#29352f;
  --accent:#3cc495; --accent-ink:#062419; --accent-soft:#173a2e;
  --ok:#4fc58c; --ok-soft:#14321f; --bad:#ff7d73; --bad-soft:#3b1a18; --warn:#f0b458; --warn-soft:#3a2a10;
  --hl:#6a5715; --hl-ink:#fff4c8;
  --c-leg:#b597e8; --c-sis:#72b2ee; --c-red:#55d0cf; --c-dev:#f0a462; --c-bd:#dcbf5a; --c-seg:#f2829a; --c-san:#74d184;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --sunk:#1c2723; --ink:#e3ebe7; --muted:#93a49d; --line:#29352f;
  --accent:#3cc495; --accent-ink:#062419; --accent-soft:#173a2e;
  --ok:#4fc58c; --ok-soft:#14321f; --bad:#ff7d73; --bad-soft:#3b1a18; --warn:#f0b458; --warn-soft:#3a2a10;
  --hl:#6a5715; --hl-ink:#fff4c8;
  --c-leg:#b597e8; --c-sis:#72b2ee; --c-red:#55d0cf; --c-dev:#f0a462; --c-bd:#dcbf5a; --c-seg:#f2829a; --c-san:#74d184;
  color-scheme:dark}
/* Modo elegido en la propia web (oscuro por defecto); va después para tener prioridad */
:root.oscuro{
  --bg:#0e1412; --surface:#151d1a; --sunk:#1c2723; --ink:#e3ebe7; --muted:#93a49d; --line:#29352f;
  --accent:#3cc495; --accent-ink:#062419; --accent-soft:#173a2e;
  --ok:#4fc58c; --ok-soft:#14321f; --bad:#ff7d73; --bad-soft:#3b1a18; --warn:#f0b458; --warn-soft:#3a2a10;
  --hl:#6a5715; --hl-ink:#fff4c8;
  --c-leg:#b597e8; --c-sis:#72b2ee; --c-red:#55d0cf; --c-dev:#f0a462; --c-bd:#dcbf5a; --c-seg:#f2829a; --c-san:#74d184;
  color-scheme:dark}
:root.claro{
  --bg:#f2f5f3; --surface:#ffffff; --sunk:#e7ede9; --ink:#14201b; --muted:#5a6a63; --line:#d3ddd8;
  --accent:#0a6b50; --accent-ink:#ffffff; --accent-soft:#d8ede4;
  --ok:#157347; --ok-soft:#ddf2e6; --bad:#b42f29; --bad-soft:#fbe4e2; --warn:#9a5b0b; --warn-soft:#fbeed8;
  --hl:#f5da6c; --hl-ink:#14201b;
  --c-leg:#6f45ad; --c-sis:#1d67a8; --c-red:#0b7f80; --c-dev:#b65d16; --c-bd:#7f6410; --c-seg:#ad2f46; --c-san:#2a7f39;
  color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
.iconbtn.themeBtn{width:auto;padding:0 10px;gap:6px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;white-space:nowrap}
.brand .themeBtn span{display:none}
@media (max-width:420px){.topbar .themeBtn span{display:none}}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-b);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-d);line-height:1.15;text-wrap:balance;margin:0}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}

/* Estructura */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 15px var(--f-d);flex:none}
.brand b{display:block;font:700 15px/1.1 var(--f-d)}
.brand small{color:var(--muted);font-size:12px}
.iconbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--sunk)}
.iconbtn svg{width:18px;height:18px}
.search{margin:4px 16px 10px;margin-left:max(16px,env(safe-area-inset-left,0px));position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px 10px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font:600 11px var(--f-m);background:var(--sunk);color:var(--muted);padding:2px 7px;border-radius:20px}
.nav a.on .cnt{background:var(--surface);color:var(--accent)}
.toc{padding:4px 10px 24px;padding-left:max(10px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.toc h4{margin:14px 10px 4px;font:600 11px/1.3 var(--f-b);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:8px}
.toc h4 i{width:8px;height:8px;border-radius:50%;background:var(--bc);flex:none}
.toc a{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.3}
.toc a:hover{background:var(--sunk)}
.toc a.on{background:var(--accent-soft)}
.toc a .n{font:600 11.5px var(--f-m);color:var(--muted)}
.toc a .st{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.toc a .st.half{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.toc a .st.done{border-color:var(--ok);background:var(--ok)}
.toc .empty{padding:10px;color:var(--muted);font-size:13px}

.topbar{display:none}
.main{min-width:0;padding-block:28px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.scrim{display:none}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:40;transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar b{font:700 15px var(--f-d)}
  .main{padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* Elementos comunes */
.eyebrow{font:600 12px/1.3 var(--f-b);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-b);padding:3px 10px;border-radius:20px;background:color-mix(in srgb,var(--bc) 14%,transparent);color:var(--bc)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--bc)}
.muted{color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:12px 14px}
.note b{color:var(--ink)}

/* Inicio */
.hero{display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;max-width:62ch;color:var(--muted);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat .v{font:700 26px/1.1 var(--f-m);font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.stat .l{font-size:12.5px;color:var(--muted)}
.meter{height:5px;background:var(--sunk);border-radius:5px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:5px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cta a{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.cta a:hover{border-color:var(--accent)}
.cta a b{font:700 16px var(--f-d)}
.cta a span{font-size:13px;color:var(--muted)}
.cta a.main-cta{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cta a.main-cta span{color:var(--accent-ink);opacity:.85}
@media (max-width:640px){.cta{grid-template-columns:minmax(0,1fr)}}
.blk{display:flex;flex-direction:column;gap:10px}
.blk-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.blk-h h2{font-size:20px;font-weight:700}
.blk-h span{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);position:relative}
.tcard:hover{border-color:var(--bc)}
.tcard .n{font:700 13px var(--f-m);color:var(--bc)}
.tcard .t{font-weight:600;font-size:14px;line-height:1.3}
.tcard .p{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:auto}
.tcard .p .meter{flex:1;margin:0}
.tcard .p .meter i{background:var(--bc)}
.tcard .ok{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center}
.tcard .ok svg{width:12px;height:12px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;counter-reset:s}
.steps div{padding:12px;border-radius:10px;background:var(--sunk);font-size:13px}
.steps div b{display:block;font-family:var(--f-d);font-size:14px;margin-bottom:2px}
.steps div b::before{counter-increment:s;content:counter(s) ". ";color:var(--accent)}
.steps.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:720px){.steps,.steps.s3{grid-template-columns:minmax(0,1fr)}}

/* Tema */
.th{display:flex;flex-direction:column;gap:10px}
.th .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.th .num{font:700 13px var(--f-m);color:var(--muted)}
.th h1{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.015em}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;align-self:flex-start;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button .c{font:600 11px var(--f-m);margin-left:4px;opacity:.7}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px;user-select:none}
.sw input{appearance:none;width:38px;height:22px;border-radius:22px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(16px)}
.tools .hint{font-size:13px;color:var(--muted)}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.pts li{position:relative;padding:14px 16px 14px 44px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);line-height:1.62}
.pts li::before{content:attr(data-i);position:absolute;left:14px;top:15px;font:700 12px var(--f-m);color:var(--bc)}
b.k{font-weight:650;background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;padding:0 1px;border-radius:2px;transition:color .15s,background .15s}
code{font:500 .88em var(--f-m);background:var(--sunk);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.cloze b.k{color:transparent;background:var(--sunk);box-shadow:inset 0 -2px 0 var(--muted);cursor:pointer;border-radius:4px;user-select:none}
.cloze b.k code{background:transparent;color:transparent}
.cloze b.k:hover{background:var(--accent-soft)}
.cloze b.k.rev{color:inherit;background:linear-gradient(transparent 58%,var(--hl) 58%);box-shadow:none;cursor:default;user-select:auto}
.cloze b.k.rev code{color:inherit;background:var(--sunk)}
.mn{background:var(--warn-soft);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.mn svg{width:22px;height:22px;color:var(--warn);flex:none;margin-top:2px}
.mn h3{font-size:15px;margin-bottom:4px;color:var(--warn)}
.mn p{margin:0}
.ofi{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ofi summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px}
.ofi p{margin:0;padding:0 16px 16px;font-size:14px;color:var(--muted);font-style:italic}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.pn a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);max-width:48%;font-size:14px}
.pn a span{font-size:12px;color:var(--muted)}
.pn a.nx{text-align:right;margin-left:auto}

/* Tarjetas */
.deck{display:flex;flex-direction:column;gap:14px}
.deck-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.fc{perspective:1400px;cursor:pointer;outline:none}
.fc-in{display:grid;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:250px;border-radius:16px;padding:26px 26px 22px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.fc-f{background:var(--surface)}
.fc-b{background:var(--accent-soft);transform:rotateY(180deg);border-color:transparent}
.fc .lab{font:600 11.5px var(--f-b);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fc .q{font:700 clamp(19px,2.6vw,24px)/1.3 var(--f-d);margin:auto 0}
.fc .a{font-size:16.5px;line-height:1.55;margin:auto 0}
.fc .tap{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.fc:focus-visible .fc-f,.fc:focus-visible .fc-b{outline:2px solid var(--accent);outline-offset:2px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade .btn{padding:14px;font-size:15px}
.grade .no{border-color:var(--bad);color:var(--bad)}
.grade .no:hover{background:var(--bad-soft)}
.grade .si{border-color:var(--ok);color:var(--ok)}
.grade .si:hover{background:var(--ok-soft)}
.kbd{font:600 11px var(--f-m);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:22px;height:5px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--ok)}
.dots i.bad{background:var(--bad)}
.dots i.cur{background:var(--accent)}
.box{font:600 11px var(--f-m);padding:2px 8px;border-radius:20px;background:var(--sunk);color:var(--muted)}

/* Test */
.qz{display:flex;flex-direction:column;gap:14px}
.qz-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qq{font:700 clamp(18px,2.4vw,22px)/1.35 var(--f-d)}
.ops{display:flex;flex-direction:column;gap:8px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.45;font-size:15px}
.op:hover:not([disabled]){border-color:var(--accent)}
.op .l{font:700 13px var(--f-m);width:24px;height:24px;border-radius:7px;background:var(--sunk);display:grid;place-items:center;flex:none;margin-top:-1px}
.op.ok{border-color:var(--ok);background:var(--ok-soft)}
.op.ok .l{background:var(--ok);color:var(--surface)}
.op.bad{border-color:var(--bad);background:var(--bad-soft)}
.op.bad .l{background:var(--bad);color:var(--surface)}

/* Simulacro */

.exam-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.06)}

.list{display:flex;flex-direction:column;gap:6px}
.list a{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink);font-size:14px}

/* Lector del temario completo y de la legislación */
.wrap.wide{max-width:1180px}
.reader{display:grid;grid-template-columns:240px minmax(0,1fr);gap:36px;align-items:start}
.rtoc{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;font-size:13px}

.rtoc summary::-webkit-details-marker{display:none}
.rtoc summary::after{content:"▾";color:var(--muted)}
.rtoc details:not([open]) summary::after{content:"▸"}
.rtoc-l{display:flex;flex-direction:column;gap:1px;padding:8px 0}

.rtoc-l a.l4{padding-left:34px;font-size:12px}

@media (max-width:1100px){.reader{grid-template-columns:minmax(0,1fr);gap:16px}.rtoc{position:static;max-height:none}}
.rprog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:45;background:transparent;pointer-events:none}

.doc{--rfs:1;font-size:calc(16.5px * var(--rfs));line-height:1.72;max-width:76ch;min-width:0}
.doc h2{font:800 1.5em/1.2 var(--f-d);margin:1.9em 0 .55em;padding-top:.8em;border-top:1px solid var(--line)}
.doc h2:first-child{margin-top:0;padding-top:0;border-top:0}
.doc h3{font:700 1.2em/1.25 var(--f-d);margin:1.5em 0 .4em}
.doc h4{font:700 1.02em/1.3 var(--f-b);margin:1.2em 0 .3em}
.doc h2,.doc h3,.doc h4,.lb{scroll-margin-top:80px}
.doc p{margin:.7em 0}
.doc ul,.doc ol{margin:.6em 0;padding-left:1.4em}
.doc li{margin:.28em 0}
.doc li>ul,.doc li>ol{margin:.25em 0}
.doc strong{font-weight:680}
.doc hr{border:0;border-top:1px dashed var(--line);margin:1.6em 0}
.doc a{color:var(--accent);text-underline-offset:2px}
.doc a.ley{font-weight:600;text-decoration:none;border-bottom:1.5px dotted var(--accent)}
.doc .tw{overflow-x:auto;margin:1em 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.doc table{border-collapse:collapse;width:100%;font-size:.9em;line-height:1.5}
.doc th,.doc td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

.doc th{background:var(--sunk);font-weight:700;white-space:nowrap}
.doc pre.code{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font:500 .86em/1.55 var(--f-m);margin:1em 0;white-space:pre}
.doc pre.code code{background:none;padding:0;font:inherit}
.doc .nota{background:var(--warn-soft);border-radius:10px;padding:4px 16px;margin:1.1em 0}
.doc .nota p{margin:.6em 0}
.rtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.leyes-tema{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:6px;margin-top:2em;font-size:15px}
.leyes-tema h3{font-size:16px;margin:0 0 4px}
.lb{padding:2px 0}
.lb .at{font:700 1.06em/1.35 var(--f-d);margin:1.3em 0 .35em}
.lb .lh2{font:800 1.2em var(--f-d);text-align:center;margin:2em 0 .1em;letter-spacing:.02em}

.lb .lh3{text-align:center;font:700 1em var(--f-d);margin:1.5em 0 .1em}

.lb .lh4{text-align:center;font-weight:600;margin:1.2em 0 .2em;color:var(--muted)}
.lb .lc{text-align:center;color:var(--muted)}
.lb .sg{padding-left:1.4em}
.lb .tb{font-size:.9em;padding:4px 10px;background:var(--sunk);border-radius:6px;margin:.2em 0}

@keyframes flash{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 1px}
.lsearch{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}

.lsearch input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;min-width:0}

.lsearch .muted{font-size:13px}
.tlist{display:flex;flex-direction:column;gap:6px}
.tlist a{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink)}
.tlist a:hover{border-color:var(--bc,var(--accent))}

.tlist .t small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.tlist .m{font:600 12px var(--f-m);color:var(--muted);text-align:right;white-space:nowrap}

/* Enlace a la fuente de una pregunta */
.qref{font-size:13px;font-weight:600;text-decoration:none;align-self:flex-start}

/* Buscador */
.buscaTodo{display:flex!important;grid-template-columns:none!important;gap:8px!important;align-items:center;margin:10px 0 2px;background:var(--accent-soft);color:var(--accent)!important;font-weight:600}

.bres{display:flex;flex-direction:column;gap:6px}
.bres a{display:flex;flex-direction:column;gap:3px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink);font-size:14px;line-height:1.5}
.bres a:hover{border-color:var(--accent)}
.bres .tg{font-size:11.5px;color:var(--muted);font-weight:600}
mark.bq{background:var(--hl);color:var(--hl-ink);border-radius:3px;box-shadow:0 0 0 2px var(--hl)}
/* Simulacro oficial */
.ofic{display:flex;flex-direction:column;gap:14px;border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}

.resv{font-size:18px;margin-top:14px}
.resv span{font:400 13px var(--f-b)}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.okc{color:var(--ok)}.badc{color:var(--bad)}
.pb{display:flex;flex-direction:column;gap:6px;width:100%}
.pb-r{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}

@media (max-width:560px){.pb-r{grid-template-columns:minmax(0,1fr) 54px}.pb-r .meter{grid-column:1/-1;grid-row:2}}
.inp{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;max-width:220px}
/* Plan de estudio */
.tareas{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.tareas li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.tareas label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0}

.tareas li.hecha span{text-decoration:line-through;color:var(--muted)}
.tareas a{font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.det summary{cursor:pointer;list-style:none}

section.panel:has(.tareas){display:flex;flex-direction:column;gap:6px}
/* Repaso exprés */
.xpl{display:flex;flex-direction:column;gap:14px}

/* Exámenes anteriores */
.exa h2{font-size:19px;margin:2px 0 4px}

.hq{display:flex;align-items:center;gap:5px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

.hq button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font:700 13px var(--f-m)}

.hq button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.hlbar,.hlpop{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);padding:8px 10px}

@media (max-width:640px){.dg-flujo{flex-direction:column;align-items:stretch}.dg-flujo .dg-n{flex:none}.dg-ar{width:2px;height:14px;align-self:center}.dg-ar::after{right:-4px;top:auto;bottom:-2px;border:5px solid transparent;border-top:7px solid var(--muted);border-bottom:0}}
.dg-capas{display:grid;gap:10px}

.dg-d{min-height:44px;padding:10px 12px;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;gap:3px;font-size:14px}

.dg-nota{margin:0;font-size:13px;color:var(--muted)}
.dg-lista{margin:0;padding-left:1.3em;font-size:13.5px;display:flex;flex-direction:column;gap:4px}

.h18{font-size:18px;margin-bottom:8px}
/* Nota estimada */
.pred{display:flex;flex-direction:column;gap:6px}

.pred-n .mono{font-size:40px;font-weight:700;line-height:1}

.pred-bar{position:relative;height:12px;border-radius:12px;background:linear-gradient(90deg,var(--bad-soft) 0 50%,var(--warn-soft) 50% 60%,var(--ok-soft) 60%);margin:10px 0 14px}

.pred-bar::before{left:50%}.pred-bar::after{left:60%}
/* Estadísticas */
svg.evo{width:100%;height:auto;display:block}
svg.evo text{font:11px var(--f-m);fill:var(--muted)}
svg.evo .lg{stroke:var(--line);stroke-width:1}
svg.evo .l5{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4}
svg.evo .lp{fill:none;stroke:var(--accent);stroke-width:2.5}
svg.evo circle.ok{fill:var(--ok)}svg.evo circle.ko{fill:var(--bad)}

.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.mapa a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;text-decoration:none;color:var(--ink);background:color-mix(in srgb,var(--mc) 22%,var(--surface));border:1.5px solid color-mix(in srgb,var(--mc) 60%,transparent)}

.mapa a span{font:600 11px var(--f-m);color:var(--muted)}

.pareja{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pareja .pa{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--c-sis) 12%,var(--surface));font-size:13.5px;line-height:1.5}

.pareja .pa b{font:700 14px var(--f-d)}
.pareja .vs{align-self:center;font:800 13px var(--f-d);color:var(--muted)}

/* Tablas */

/* Gráficos nuevos */
.dg-barras{display:flex;flex-direction:column;gap:6px}
.dg-br{display:grid;grid-template-columns:minmax(120px,260px) minmax(0,1fr) auto;gap:10px;align-items:center}

@media (max-width:640px){.dg-cmp{grid-template-columns:minmax(0,1fr)!important}.dg-cmp>span:first-child{display:none}.dg-cmp .dg-fl{margin-top:8px;color:var(--ink)}.dg-cmp .dg-ch2{display:none}.dg-cv::before{content:attr(data-col);display:block;font:700 11px var(--f-b);color:var(--bc);margin-bottom:2px}}
.dg-tl{display:flex;flex-direction:column;gap:6px}

.dg-tt{position:relative;height:22px;border-radius:6px;background:var(--sunk)}

@media (max-width:560px){.dg-te{grid-template-columns:minmax(0,1fr)}}

.mm{display:flex;flex-direction:column;align-items:center;gap:0}

/* ===== Rediseño: cuaderno de estudio clínico-digital. Pizarra verdosa, verde mar y el ámbar del rotulador. ===== */
:root.oscuro{
  --bg:#0c1214; --surface:#131b1e; --sunk:#1a2427; --ink:#e7efed; --muted:#93a6a2; --line:#243136;
  --accent:#45c9a2; --accent-ink:#04231a; --accent-soft:#163a30;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 10px 28px -16px rgba(0,0,0,.75);
  --glow:rgba(69,201,162,.09); color-scheme:dark}
:root.claro{
  --bg:#f2f6f4; --surface:#ffffff; --sunk:#e8efec; --ink:#13201c; --muted:#53655e; --line:#d3ded9;
  --accent:#0b7356; --accent-ink:#ffffff; --accent-soft:#d6eee4;
  --shadow:0 1px 2px rgba(16,40,32,.06),0 10px 26px -18px rgba(16,40,32,.35);
  --glow:rgba(11,115,86,.07); color-scheme:light}
:root{--shadow:0 1px 2px rgba(16,40,32,.06),0 10px 26px -18px rgba(16,40,32,.35);--glow:rgba(11,115,86,.07);--r:14px}
body{background:radial-gradient(900px 520px at 12% -8%,var(--glow),transparent 70%) fixed,var(--bg)}
.panel,.stat,.tcard,.eq,.noti,.xp,.tbx,.exa,.cta a,.qa,figure.dg{box-shadow:var(--shadow)}
.panel,.stat{border-radius:var(--r)}
.wrap{animation:entra .22s ease-out both}
@keyframes entra{from{opacity:.55;transform:translateY(5px)}to{opacity:1;transform:none}}
.side{background:color-mix(in srgb,var(--surface) 94%,var(--bg))}
.nav a{position:relative;transition:background .15s,color .15s}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.navh{margin-top:16px}
.btn{transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.pri{box-shadow:0 6px 18px -8px var(--accent)}
.search .kq{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:600 10.5px var(--f-m);color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--surface);cursor:pointer}

/* ===== Efectos visuales ===== */
@property --p{syntax:"<number>";inherits:true;initial-value:0}

.ring{animation:anillo 1.1s cubic-bezier(.2,.8,.2,1) both}

.meter i{transform-origin:left center;animation:barra 1s .15s cubic-bezier(.2,.8,.2,1) both}

/* Botones: onda al pulsar, brillo y elevación */
.btn,.op,.hoy-i,.iconbtn,.stabs button,.tcard,.bnav a,.bnav button,.bl-i{position:relative;overflow:hidden}

.search:focus-within .kq{opacity:0}
/* Resaltado deslizante */
.sbody{position:relative;--fa:0px;--fb:0px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fa),#000 calc(100% - var(--fb)),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fa),#000 calc(100% - var(--fb)),transparent 100%)}
.side.s-arr .sbody{--fa:22px}
.side.s-aba .sbody{--fb:30px}
.shov{position:absolute;left:0;top:0;width:0;height:0;border-radius:9px;background:var(--sunk);opacity:0;pointer-events:none;z-index:0;transition:opacity .2s}
.shov.on{opacity:1;transition:transform .28s cubic-bezier(.3,1.25,.5,1),width .28s,height .28s,opacity .2s}
.nav a,.toc a,.tocb summary{position:relative;z-index:1}
.nav a:not(.on):hover,.toc a:not(.on):hover,.tocb summary:hover{background:transparent}
/* Elemento activo */
.nav a.on{background:linear-gradient(90deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 30%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent)}
.nav a.on svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 60%,transparent));animation:icoOn .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes icoOn{40%{transform:scale(1.28) rotate(-10deg)}}
.nav a[href="#noticias"] .cnt{background:var(--accent);color:var(--accent-ink);animation:late 2.4s ease-out infinite}
@keyframes late{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
/* Títulos de grupo con una línea */
.navh{display:flex;align-items:center;gap:8px}
.navh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);transform-origin:left center}
/* Entrada escalonada al cargar, al cambiar de pestaña y al abrir el menú en el móvil */
.side.entra .nav>*{animation:aparece .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*22ms)}
.side.entra .toc>*{animation:aparece .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*45ms)}
.side.entra .navh::after{animation:linea .7s .25s cubic-bezier(.2,.8,.2,1) both}
@keyframes linea{from{transform:scaleX(0)}}
.side.entra .nav .cnt{animation:cuenta .45s .3s cubic-bezier(.3,1.6,.5,1) both}
@keyframes cuenta{from{transform:scale(0)}}
/* Temas: barra del color del bloque y entrada al desplegar */
.toc a::before{content:"";position:absolute;left:2px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--bc);transform:scaleY(0);transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.toc a:hover::before,.toc a.on::before{transform:scaleY(1)}
.toc a .n{transition:color .15s}
.toc a:hover .n,.toc a.on .n{color:var(--bc)}
.toc a .st{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.toc a:hover .st{transform:scale(1.3)}
.tocb summary::after{content:"▸";transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tocb[open] summary::after{content:"▸";transform:rotate(90deg)}
.tocb summary i{transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.tocb summary:hover i{transform:scale(1.4);box-shadow:0 0 0 4px color-mix(in srgb,var(--bc) 22%,transparent)}
.tocb.abre>a{animation:aparece .35s cubic-bezier(.2,.8,.2,1) both}
.tocb.abre>a:nth-of-type(2){animation-delay:.03s}.tocb.abre>a:nth-of-type(3){animation-delay:.06s}.tocb.abre>a:nth-of-type(4){animation-delay:.09s}.tocb.abre>a:nth-of-type(5){animation-delay:.12s}.tocb.abre>a:nth-of-type(6){animation-delay:.15s}.tocb.abre>a:nth-of-type(7){animation-delay:.18s}.tocb.abre>a:nth-of-type(n+8){animation-delay:.21s}
/* Pie: brillo que recorre la barra de progreso */
.sprog .meter i{position:relative;overflow:hidden}
.sprog .meter i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:brilloB 3s 1.2s ease-in-out infinite}
@keyframes brilloB{to{transform:translateX(100%)}}
.sfoot .themeBtn:hover svg{transform:rotate(40deg) scale(1.1)}
.sbody>.shov{animation:none!important}

/* ===== Nuevas secciones: siglas, puntos débiles, racha y logros, retos, por qué fallaste ===== */
/* Animaciones generales del resto de vistas */
.list>*,.cards>*,.parejas>*,.noti,.xp,.tbx,.exa,.logro,.sg,.hc{animation:sube .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*35ms)}
.sg{animation-delay:calc(var(--i,0)*18ms)}
.hc{animation:pop .4s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i,0)*14ms)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.list>a,.list>div{transition:background .15s,padding-left .2s}
.list>a:hover{padding-left:16px}
.tabs button{transition:background .2s,color .2s,box-shadow .2s,transform .15s}
.tabs button:active{transform:scale(.96)}
.doc table tbody tr,.tabla tbody tr,table tbody tr{transition:background .15s}
.doc table tbody tr:hover,table tbody tr:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
details[open]>:not(summary){animation:aparece .3s ease both}
.chip{transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.chip:hover{transform:scale(1.05)}
.empty-state>svg{animation:flotaIc 3.5s ease-in-out infinite}
@keyframes flotaIc{50%{transform:translateY(-6px) rotate(-4deg)}}
.evo polyline{stroke-dasharray:3000;stroke-dashoffset:3000;animation:traza 1.6s .2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes traza{to{stroke-dashoffset:0}}
.pareja .vs{display:inline-block;animation:late2 2.6s ease-in-out infinite}
@keyframes late2{50%{transform:scale(1.15)}}
.fc .grade button,#grade button{transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
#grade:not([hidden]) button{animation:pop .35s cubic-bezier(.3,1.5,.5,1) both}
#grade:not([hidden]) button:nth-child(2){animation-delay:.06s}
.plazo{transition:transform .2s}
.plazo.prox,.plazo.abierto{animation:latePl 2.8s ease-in-out infinite}
@keyframes latePl{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 22%,transparent)}}
.task input[type=checkbox]:checked,.tarea input:checked{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
/* Racha en la portada */
.racha{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:5px 11px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--sunk);text-decoration:none;border:1px solid var(--line)}
.racha svg{width:16px;height:16px}
.racha.on{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.racha.on svg{animation:llama 1.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes llama{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}}
/* Racha y logros */
.rachas{display:grid;grid-template-columns:1.6fr repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.rachas{grid-template-columns:repeat(2,minmax(0,1fr))}.rch.big{grid-column:1/-1}}
.rch{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.rch b{font-size:28px;line-height:1.1}
.rch b small{font-size:15px;color:var(--muted)}
.rch span{font-size:13px;color:var(--muted)}
.rch.big{flex-direction:row;align-items:center;gap:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--warn) 14%,var(--surface)),var(--surface) 70%)}
.rch.big svg{width:44px;height:44px;color:var(--muted);flex:none}
.rch.big.on svg{color:var(--warn);animation:llama 1.4s ease-in-out infinite;transform-origin:50% 90%;filter:drop-shadow(0 4px 10px color-mix(in srgb,var(--warn) 50%,transparent))}
.rch.big b{font-size:40px}
.cal-w{overflow-x:auto;padding-bottom:4px}
.cal{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;width:max-content}
.cal i{border-radius:3px;background:var(--sunk);animation:pop .35s both;animation-delay:calc(var(--d,0)*3ms)}
.cal i.v{background:transparent;animation:none}
.cal i.n1{background:color-mix(in srgb,var(--accent) 30%,var(--sunk))}
.cal i.n2{background:color-mix(in srgb,var(--accent) 55%,var(--sunk))}
.cal i.n3{background:color-mix(in srgb,var(--accent) 78%,var(--sunk))}
.cal i.n4{background:var(--accent)}
.cal-ley{display:flex;align-items:center;gap:4px;font-size:12px;margin-top:8px}
.cal-ley i{width:12px;height:12px;border-radius:3px;background:var(--sunk)}
.cal-ley i.n1{background:color-mix(in srgb,var(--accent) 30%,var(--sunk))}.cal-ley i.n2{background:color-mix(in srgb,var(--accent) 55%,var(--sunk))}.cal-ley i.n3{background:color-mix(in srgb,var(--accent) 78%,var(--sunk))}.cal-ley i.n4{background:var(--accent)}
.logros{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.logro{position:relative;display:flex;flex-direction:column;gap:3px;padding:16px 14px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);overflow:hidden;animation-delay:calc(var(--i,0)*40ms)}
.logro .lg-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);margin-bottom:6px}
.logro .lg-ic svg{width:22px;height:22px}
.logro b{font:700 14.5px/1.25 var(--f-d)}
.logro small{font-size:12.5px;color:var(--muted)}
.logro .lg-f{position:absolute;top:12px;right:12px;font-size:11px;color:var(--muted)}
.logro .lg-f svg{width:15px;height:15px}
.logro:not(.ok){opacity:.62}
.logro:not(.ok) b{color:var(--muted)}
.logro.ok{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface) 60%)}
.logro.ok .lg-ic{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -6px var(--accent)}
.logro.ok::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:brillaL 4.5s ease-in-out infinite;animation-delay:calc(var(--i,0)*.25s);pointer-events:none}
@keyframes brillaL{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.toast-logro{display:flex;align-items:center;gap:10px}
.toast-logro svg{width:24px;height:24px;flex:none;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
/* Glosario de siglas */
.sg-bar{display:flex;flex-direction:column;gap:10px;position:sticky;top:0;z-index:5;padding:10px 0;background:linear-gradient(var(--bg) 80%,transparent)}
@media (max-width:900px){.sg-bar{top:calc(env(safe-area-inset-top,0px) + 57px)}}
.sg-s{margin:0}
.sg-s input{padding:11px 14px 11px 36px;font-size:15px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:5px 11px;font:600 12.5px var(--f-b);cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.chipb i{width:8px;height:8px;border-radius:50%;background:var(--bc)}
.chipb:hover{transform:translateY(-1px)}
.chipb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sg-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
@media (max-width:480px){.sg-l{grid-template-columns:minmax(0,1fr)}}
.sg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--bc);transition:transform .2s,box-shadow .2s;outline:none}
.sg:hover,.sg:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow)}
.sg>b{font-size:15px;min-width:64px;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--bc) 14%,transparent);color:var(--bc);text-align:center;overflow-wrap:anywhere}
.sg p{margin:0}
.sg-e{font-size:14.5px;line-height:1.4;transition:filter .25s,opacity .25s}
.sg-n{font-size:12.5px;margin-top:3px!important}
.sg-t{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sg-t a{font:600 11px var(--f-m);padding:1px 6px;border-radius:6px;background:var(--sunk);color:var(--muted);text-decoration:none}
.sg-t a:hover{background:var(--accent-soft);color:var(--accent)}
.memoria .sg{cursor:pointer}
.memoria .sg:not(.ver) .sg-e,.memoria .sg:not(.ver) .sg-n{filter:blur(6px);opacity:.5;user-select:none}
/* Por qué fallaste */
.pq-c{margin-top:10px;padding:12px 14px;border-radius:11px;background:var(--surface);border:1px dashed color-mix(in srgb,var(--bad) 40%,var(--line));display:flex;flex-direction:column;gap:10px;animation:sube .4s .1s cubic-bezier(.2,.8,.2,1) both}
.pq-c h5{margin:0;display:flex;align-items:center;gap:8px;font:700 14px var(--f-d);color:var(--ink)}
.pq-c h5 svg{width:18px;height:18px;color:var(--warn)}
.pq-l{display:block;font:700 10.5px var(--f-b);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.pq-dif p{margin:2px 0;font-size:14px}
mark.dm{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px;border-radius:4px;padding:0 3px}
mark.dp{background:var(--ok-soft);color:var(--ok);font-weight:700;border-radius:4px;padding:0 3px}
.pq-o{margin:0;font-size:14px}
.pq-m{margin:0;font-size:15px;line-height:1.5;font-weight:500}
.pq-t{margin:0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:14px;line-height:1.5}
.pq-t a{display:block;margin-top:6px;font-weight:600;font-size:13px;color:var(--accent)}
/* Puntos débiles */
.ph-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.heat{display:flex;flex-direction:column;gap:12px}
.heat-b{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:640px){.heat-b{grid-template-columns:minmax(0,1fr)}}
.heat-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.heat-h i{width:9px;height:9px;border-radius:50%;background:var(--bc);flex:none}
.heat-g{display:flex;flex-wrap:wrap;gap:6px}
.hc{width:54px;height:54px;border-radius:12px;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 8%,transparent);transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .2s}
.hc:hover{transform:scale(1.12);box-shadow:var(--shadow);z-index:1}
.hc b{font-size:16px;line-height:1}
.hc small{font-size:10.5px;color:color-mix(in srgb,var(--ink) 75%,transparent)}
.heat-ley{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;margin-top:14px}
.heat-ley i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
/* Retos */
.retos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:720px){.retos{grid-template-columns:minmax(0,1fr)}}
.reto{display:flex;flex-direction:column;gap:10px;align-items:flex-start;position:relative;overflow:hidden}
.reto h2{font-size:20px}
.reto p{margin:0}
.reto-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.reto-ic svg{width:26px;height:26px}
.reto:hover .reto-ic svg{animation:llama 1s ease-in-out infinite}
.reto-rec{font-size:13px;color:var(--muted)}
.juego{display:flex;flex-direction:column;gap:12px;margin-top:4px;transition:box-shadow .3s}
.jg-top{display:flex;align-items:center;gap:12px}
.jg-s{font-size:34px;font-weight:800;line-height:1;min-width:56px}
.jg-m{flex:1}
.jg-bar{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden}
.jg-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--c-sis));transform-origin:left center;border-radius:8px}
.jg-bar i.poco{background:var(--bad);animation:parpadea .5s ease-in-out infinite alternate}
@keyframes parpadea{to{opacity:.5}}
.jg-q{animation:entraQ .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes entraQ{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.vidas{display:inline-flex;gap:4px}
.vidas i svg{width:22px;height:22px;color:var(--bad);fill:var(--bad)}
.vidas i.perdida svg{color:var(--line);fill:transparent;animation:pierde .5s ease}
@keyframes pierde{0%{transform:scale(1.4)}100%{transform:none}}
.juego.flash-ok{animation:fOk .5s ease}
.juego.flash-ko{animation:fKo .5s ease}
@keyframes fOk{30%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 45%,transparent)}}
@keyframes fKo{20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}30%{box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 45%,transparent)}}
/* Simulacro: reparto por bloques */
.rep{display:flex;gap:3px;height:30px;border-radius:10px;overflow:hidden;margin-top:6px}
.rep-i{display:flex;align-items:center;justify-content:center;background:var(--bc);color:#fff;font-size:12px;min-width:0;transition:flex .4s cubic-bezier(.3,1.2,.5,1)}
.rep-i b{text-shadow:0 1px 2px rgba(0,0,0,.35)}
.rep-l{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin-top:8px}
.rep-l span{display:inline-flex;align-items:center;gap:6px}
.rep-l i{width:9px;height:9px;border-radius:50%;background:var(--bc)}
.sim-bq{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.sim-bq button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--bc);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font:inherit;transition:transform .2s,box-shadow .2s}
.sim-bq button:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.sim-bq b{font:700 14px var(--f-d)}
.sim-bq small{color:var(--muted);font-size:12px}

/* ===== Ajustes de lectura, tarjetas en audio, repaso semanal y audios sin conexión ===== */
.reader .doc{line-height:var(--rlh,1.7);font-family:var(--rff,inherit);letter-spacing:var(--rls,0)}
.reader .doc p,.reader .doc li,.reader .doc h2,.reader .doc h3,.reader .doc h4,.reader .doc blockquote{max-width:var(--rmw,70ch)}
body.modo-lectura .side,body.modo-lectura .topbar,body.modo-lectura .bnav,body.modo-lectura .rtoc,body.modo-lectura .pn,body.modo-lectura .lectura{display:none!important}
body.modo-lectura .app{grid-template-columns:minmax(0,1fr)}
body.modo-lectura .reader{grid-template-columns:minmax(0,1fr)!important}
body.modo-lectura .wrap{max-width:900px}
body.modo-lectura .main{padding-top:max(28px,env(safe-area-inset-top,0px))}
.salir-lect{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:60;box-shadow:var(--shadow)}
.lectp{position:fixed;right:max(16px,env(safe-area-inset-right,0px));z-index:85;width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 120px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.55);padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;animation:paleta .22s cubic-bezier(.2,.9,.3,1.2) both}
.lectp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.lectp-h b{font:700 16px var(--f-d)}
.lectp .chips.col{flex-direction:column;align-items:stretch}
.lectp .chips.col .chipb{justify-content:flex-start}
.lectp-foco{margin-top:6px;font-size:14px}
.ok-off{border-color:var(--ok);color:var(--ok)}

/* Datos derivados */
let _cards=null,_qs=null;
function allCards(filter){if(!_cards){_cards=[];TEMAS.forEach(t=>t.f.forEach((c,i)=>_cards.push({id:t.n+"-"+i,n:t.n,f:c[0],a:c[1]})))}return filter?_cards.filter(c=>filter(TM[c.n])):_cards.slice()}
const qItem=(t,q,i)=>({id:t.n+"-"+i,n:t.n,q:q[0],o:q[1],x:q[2]||"",r:q[3]||""});
function allQs(filter){if(!_qs){_qs=[];TEMAS.forEach(t=>t.q.forEach((q,i)=>_qs.push(qItem(t,q,i))))}return filter?_qs.filter(q=>filter(TM[q.n])):_qs.slice()}
/* Enlace a la fuente de una pregunta: el artículo de la ley si lo tiene, o el tema completo */
function refLink(it){
  const m=(it.r||"").match(/^([A-Za-z0-9-]+)#([A-Za-z0-9-]+)$/);
  if(m&&LIDXF(m[1])) return `<a class="qref" href="#ley-${m[1]}--${m[2]}">Ver el artículo ${esc(m[2])} de ${esc(LIDXF(m[1]).c.split(",")[0])} →</a>`;
  return `<a class="qref" href="#leer-${it.n}">Repasar en el tema ${it.n} →</a>`;
}
function LIDXF(id){return (typeof LEYES_INDICE!=="undefined"?LEYES_INDICE:[]).find(l=>l.id===id)}
const isDue=id=>{const r=S.box[id];return !r||r.d<=hoy()};
const dueCards=()=>allCards().filter(c=>isDue(c.id));
const mastered=n=>TEMAS.find(t=>t.n===n).f.filter((c,i)=>(S.box[n+"-"+i]||{}).b>=3).length;
function grade(id,ok){marcarDia();const r=S.box[id]||{b:0,d:0};const b=ok?Math.min(r.b+1,5):0;S.box[id]={b,d:hoy()+(ok?INT[b]:0)};save()}
function temaState(n){const est=!!S.est[n],best=S.best[n];if(est&&best>=70)return"done";if(est||best!=null)return"half";return""}

/* Barra lateral */
function renderNav(h){
  try{revisarLogros()}catch(e){}
  const hb0=h.split(/[-\/]/)[0];document.querySelectorAll("#bnav a").forEach(a=>a.classList.toggle("on",a.dataset.b===hb0||(a.dataset.b==="temario"&&/^(leer|tema)$/.test(hb0))||(a.dataset.b==="adaptativo"&&/^(adaptativo|repaso|simulacro|trampas|practicas|fallos)$/.test(hb0))));
  const bd=document.querySelector("#bnav .bdot");if(bd)bd.hidden=!noticiasNuevas();
  const nf=Object.keys(S.fail).length, nd=dueCards().length;
  const pend=planHoyPendientes();
  const nn=Object.values(S.hl||{}).reduce((a,x)=>a+x.length,0);

/* ---------- Tarjetas ---------- */
function deck(el,cards,opt){
  let q=cards.slice(), res={}, flipped=false;
  const total=cards.length;
  function draw(){
    if(!q.length){
      const ok=Object.values(res).filter(v=>v).length;
      el.innerHTML=`<div class="panel empty-state">${ICON.party}<h2>Mazo terminado</h2><p class="muted">${ok} de ${total} a la primera. Las que fallaste volverán antes en el repaso.</p><div class="row" style="justify-content:center"><button class="btn pri" id="again">Repetir el mazo</button>${opt.onEnd?"":'<a class="btn" href="#repaso">Ir al repaso general</a>'}</div></div>`;
      $("#again").addEventListener("click",()=>{q=shuffle(cards.slice());res={};draw()});
      keyH=null; refreshSide(); return;
    }
    const c=q[0], t=TM[c.n], box=(S.box[c.id]||{b:0}).b;
    flipped=false;
    el.innerHTML=`<div class="deck">
      <div class="deck-top"><span>${opt.title||""} · quedan <b class="mono">${q.length}</b></span><span class="row" style="gap:6px"><span class="box" title="Caja de repaso (0-5)">caja ${box}</span><span class="chip" style="${bc(t.b)}"><i></i>Tema ${t.n}</span></span></div>
      <div class="dots">${cards.map(k=>`<i class="${k.id===c.id?"cur":res[k.id]===true?"ok":res[k.id]===false?"bad":""}"></i>`).join("")}</div>
      <div class="fc" id="fc" role="button" tabindex="0" aria-label="Tarjeta: pulsa para girarla">
        <div class="fc-in">
          <div class="fc-f"><span class="lab">Pregunta</span><div class="q">${md(c.f)}</div><span class="tap">Toca la tarjeta o pulsa <span class="kbd">espacio</span> para ver la respuesta</span></div>
          <div class="fc-b"><span class="lab">Respuesta</span><div class="a">${md(c.a)}</div><span class="tap">${esc(t.s)}</span></div>
        </div>
      </div>
      <div class="grade" id="grade" hidden><button class="btn no" data-g="0">No lo sabía <span class="kbd">1</span></button><button class="btn si" data-g="1">Lo sabía <span class="kbd">2</span></button></div>
    </div>`;
    const fc=$("#fc");
    const flip=()=>{flipped=!flipped;fc.classList.toggle("flip",flipped);if(flipped)$("#grade").hidden=false};
    fc.addEventListener("click",flip);
    el.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>answer(b.dataset.g==="1")));
    keyH=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}else if(flipped&&e.key==="1")answer(false);else if(flipped&&e.key==="2")answer(true)};
  }
  function answer(ok){const c=q.shift();if(!(c.id in res))res[c.id]=ok;grade(c.id,ok);if(!ok)q.push(c);draw()}
  draw();
}

/* ---------- Test con corrección inmediata ---------- */
function quiz(el,items,opt){
  let its=opt.keep?items.slice():shuffle(items.slice()), i=0, ok=0, wrong=[], done=false;
  function draw(){
    if(i>=its.length) return end();
    const it=its[i], t=TM[it.n];
    const o=shuffle(it.o.map((x,j)=>({x,c:j===0})));
    done=false;
    el.innerHTML=`<div class="qz">
      <div class="qz-top"><span>Pregunta <b class="mono">${i+1}</b> de <span class="mono">${its.length}</span>${opt.tema?"":` · <span class="chip" style="${bc(t.b)}"><i></i>Tema ${t.n}</span>`}</span><span class="mono">${ok} ✓ · ${wrong.length} ✗</span></div>
      <div class="bar"><i style="width:${i/its.length*100}%"></i></div>
      <h2 class="qq">${md(it.q)}</h2>
      <div class="ops">${o.map((x,j)=>`<button class="op" data-j="${j}"><span class="l">${"ABCD"[j]}</span><span>${md(x.x)}</span></button>`).join("")}</div>
      <div id="fb"></div></div>`;
    const btns=[...el.querySelectorAll(".op")];
    const pick=j=>{ if(done) return; done=true;
      const good=o[j].c, ci=o.findIndex(x=>x.c);
      btns.forEach((b,k)=>{b.disabled=true;if(k===ci)b.classList.add("ok");else if(k===j)b.classList.add("bad")});
      if(!opt.libre){S.vistas=S.vistas||{};S.vistas[it.id]=1;registrar(it.id,good);}
      if(good){ok++;if(!opt.libre)delete S.fail[it.id]}else{wrong.push(it);if(!opt.libre)S.fail[it.id]=1}
      save();
      $("#fb").innerHTML=`<div class="fb ${good?"ok":"bad"}"><h4>${good?"Correcto":"Incorrecto · la respuesta es la "+"ABCD"[ci]}</h4>${it.x?`<p>${md(it.x)}</p>`:""}${refLink(it)}${good?"":'<div id="pq"></div>'}</div>
        <div class="row" style="margin-top:12px"><button class="btn pri" id="nx">${i+1<its.length?"Siguiente":"Ver resultado"} <span class="kbd" style="color:inherit;border-color:currentColor">Intro</span></button></div>`;
      $("#nx").addEventListener("click",nxt); $("#nx").focus({preventScroll:true});

    </div>`;

const OFICIAL={n:95,reserva:10,min:115,pen:.25,max:50};
function seleccionOficial(){
  // Reparto proporcional: dos preguntas de cada tema y las 15 restantes de temas al azar sin repetir;
  // las 10 de reserva salen del resto del banco
  const porTema={};TEMAS.forEach(t=>porTema[t.n]=shuffle(t.q.map((q,i)=>qItem(t,q,i))));
  const sel=[];TEMAS.forEach(t=>sel.push(...porTema[t.n].splice(0,2)));
  shuffle(TEMAS.map(t=>t.n)).slice(0,OFICIAL.n-sel.length).forEach(n=>{const q=porTema[n].shift();if(q)sel.push(q)});
  const resto=shuffle([].concat(...Object.values(porTema)));
  while(sel.length<OFICIAL.n&&resto.length)sel.push(resto.shift());
  return {qs:shuffle(sel),res:resto.slice(0,OFICIAL.reserva)};
}

function runExam(qs,pen,total,opt){

      <div class="ops">${opts[i].map((o,j)=>`<button class="op" data-i="${i}" data-j="${j}"><span class="l">${"ABCD"[j]}</span><span>${md(o.x)}</span></button>`).join("")}</div>

      ${res.length?`<h2 class="resv">Preguntas de reserva <span class="muted">· solo cuentan si se anula alguna; respóndelas igualmente</span></h2>${res.map((q,k)=>card(q,qs.length+k)).join("")}`:""}</div></div>`;
  const ex=$("#exq");
  ex.addEventListener("click",e=>{const b=e.target.closest(".op");const c=e.target.closest("[data-c]");
    if(b&&!b.disabled){const i=+b.dataset.i,j=+b.dataset.j;ans[i]=j;ex.querySelectorAll(`#eq${i} .op`).forEach((x,k)=>x.classList.toggle("sel",k===j));ex.querySelector(`[data-c="${i}"]`).hidden=false;cnt()}
    if(c){const i=+c.dataset.c;ans[i]=null;ex.querySelectorAll(`#eq${i} .op`).forEach(x=>x.classList.remove("sel"));c.hidden=true;cnt()}});
  function cnt(){$("#an").textContent=ans.slice(0,qs.length).filter(a=>a!==null).length}
  $("#sub").addEventListener("click",()=>{const blanks=ans.slice(0,qs.length).filter(a=>a===null).length;
    if(!armed){armed=true;$("#sub").textContent=blanks?`Quedan ${blanks} en blanco · pulsa otra vez para entregar`:"Pulsa otra vez para entregar";setTimeout(()=>{armed=false;const s=$("#sub");if(s)s.textContent="Entregar"},4000);return}
    finish()});
  if(total){timer=setInterval(()=>{left--;const tm=$("#tm");if(!tm)return;tm.textContent=fmt(left);tm.classList.toggle("low",left<=300);if(left<=0)finish()},1000)}
  function fmt(s){s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
  function finish(){
    if(timer){clearInterval(timer);timer=null}
    let A=0,F=0,B=0;S.vistas=S.vistas||{};
    all.forEach((q,i)=>{const a=ans[i];S.vistas[q.id]=1;const cuenta=i<qs.length;
      if(a===null){if(cuenta)B++;return}
      registrar(q.id,opts[i][a].c);
      if(opts[i][a].c){if(cuenta)A++;delete S.fail[q.id]}else{if(cuenta)F++;S.fail[q.id]=1}});
    const net=Math.max(0,A-F*pen), nota=Math.round(net/qs.length*1000)/100;
    S.sims=(S.sims||[]).concat({d:Date.now(),nota,o:opt.oficial?1:0,n:qs.length,A,F,B}).slice(-50);

    top.innerHTML=`<div class="res-head"><div class="ring" style="--p:${nota*10}"><div><div><b>${nota.toFixed(2)}</b><small>sobre 10</small></div></div></div>
      <div><h2>${nota>=5?"Aprobado":"Suspenso"} en el simulacro</h2>

      <p class="muted mono" style="margin:6px 0 0">${A} aciertos · ${F} errores · ${B} en blanco · netas ${net.toFixed(2)}${usado?` · ${Math.round(usado/60)} min`:""}</p>

      ${porBloque()}`;
    const wrap=main.querySelector(".wrap");
    wrap.querySelector(".exam-bar").remove();
    wrap.prepend(top);
    $("#newS").addEventListener("click",e=>{if(location.hash==="#simulacro"){e.preventDefault();route()}});
    all.forEach((q,i)=>{const box=$("#eq"+i),a=ans[i],ci=opts[i].findIndex(o=>o.c);
      box.querySelectorAll(".op").forEach((b,k)=>{b.disabled=true;b.classList.remove("sel");if(k===ci)b.classList.add("ok");else if(k===a)b.classList.add("bad")});
      box.querySelector(".clear").remove();
      box.style.borderLeft=`4px solid var(${a===null?"--muted":a===ci?"--ok":"--bad"})`;
      box.insertAdjacentHTML("beforeend",`<div class="x"><b>Tema ${q.n}.</b> ${a===null?"En blanco. ":""}${md(q.x||"")} ${refLink(q)}</div>`)});
    window.scrollTo({top:0,behavior:"smooth"});
    function porBloque(){
      const r={};qs.forEach((q,i)=>{const b=TM[q.n].b;r[b]=r[b]||{a:0,t:0};r[b].t++;const a=ans[i];if(a!==null&&opts[i][a].c)r[b].a++});
      return `<div class="pb">${ORDEN.filter(b=>r[b]).map(b=>{const p=Math.round(r[b].a/r[b].t*100);return `<div class="pb-r" style="${bc(b)}"><span>${BLOQUES[b].n}</span><span class="meter"><i style="width:${p}%;background:var(--bc)"></i></span><span class="mono">${r[b].a}/${r[b].t}</span></div>`}).join("")}</div>`;
    }
  }
}

/* ---------- Carga diferida de contenidos ---------- */
const pad=n=>String(n).padStart(2,"0");
const IDX=(typeof TEMARIO_INDICE!=="undefined")?TEMARIO_INDICE:{};
const LIDX=(typeof LEYES_INDICE!=="undefined")?LEYES_INDICE:[];
const cargas={};
function cargar(src){
  if(cargas[src]) return cargas[src];
  return cargas[src]=new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>{delete cargas[src];ko(new Error("No se pudo cargar "+src))};document.head.appendChild(s)});
}
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const minLect=w=>Math.max(1,Math.round(w/200));

/* Markdown sencillo: títulos, párrafos, listas anidadas, tablas, notas (>) y enlaces a artículos [[ID#aN|texto]] */
function inl(s){
  let h=esc(s);
  h=h.replace(/\[\[([A-Za-z0-9-]+)(?:#([A-Za-z0-9-]+))?\|([^\]]+)\]\]/g,(m,id,a,t)=>`<a class="ley" href="#ley-${id}${a?"--"+a:""}">${t}</a>`);
  h=h.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/(^|[\s(«])_([^_]+)_(?=[\s.,;:)»]|$)/g,"$1<em>$2</em>");
  return h;
}
function lista(lines){
  let h="",open=[];
  lines.forEach(l=>{
    const m=l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if(!m){h+=" "+inl(l.trim());return}
    const lv=Math.floor(m[1].length/2), tag=/\d/.test(m[2])?"ol":"ul";
    if(lv+1>open.length){while(open.length<lv+1){h+=`<${tag}>`;open.push(tag)}}
    else{h+="</li>";while(open.length>lv+1){h+=`</${open.pop()}></li>`}}
    h+=`<li>${inl(m[3])}`;
  });
  h+="</li>";while(open.length){h+=`</${open.pop()}>`;if(open.length)h+="</li>"}
  return h;
}
function mdDoc(src,pref){
  const L=String(src).replace(/\r/g,"").split("\n"); let i=0,hn=0; const out=[],toc=[];
  const esLista=x=>/^\s*([-*]|\d+\.)\s+/.test(x);
  while(i<L.length){
    const l=L[i]; let m;
    if(!l.trim()){i++;continue}
    if((m=l.match(/^::diagrama\s+([\w-]+)\s*$/))){out.push(`<figure class="dg" data-dg="${esc(m[1])}"></figure>`);i++;continue}
    if(l.trim().startsWith("```")){const c=[];i++;while(i<L.length&&!L[i].trim().startsWith("```")){c.push(L[i]);i++}i++;out.push(`<pre class="code"><code>${esc(c.join("\n"))}</code></pre>`);continue}
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){const lv=Math.max(2,m[1].length),id=(pref||"s")+(++hn);out.push(`<h${lv} id="${id}">${inl(m[2])}</h${lv}>`);toc.push([lv,id,m[2].replace(/\*\*|`/g,"")]);i++;continue}
    if(/^-{3,}$/.test(l.trim())){out.push("<hr>");i++;continue}
    if(l.startsWith("|")){
      const rows=[];while(i<L.length&&L[i].startsWith("|")){rows.push(L[i]);i++}
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      let head=null,body=rows;if(rows[1]&&/^\|?\s*:?-{2,}/.test(rows[1])){head=cells(rows[0]);body=rows.slice(2)}
      out.push(`<div class="tw"><table>${head?`<thead><tr>${head.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead>`:""}<tbody>${body.map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue}
    if(l.startsWith(">")){const b=[];while(i<L.length&&L[i].startsWith(">")){b.push(L[i].replace(/^>\s?/,""));i++}out.push(`<div class="nota">${mdDoc(b.join("\n"),"n"+i+"-").html}</div>`);continue}
    if(esLista(l)){const it=[];while(i<L.length&&(esLista(L[i])||(it.length&&/^\s{2,}\S/.test(L[i])))){it.push(L[i]);i++}out.push(lista(it));continue}
    const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|\||>|\s*```|::)/.test(L[i])&&!esLista(L[i])&&!/^-{3,}$/.test(L[i].trim())){p.push(L[i].trim());i++}
    out.push(`<p>${inl(p.join(" "))}</p>`);
  }
  return {html:out.join("\n"),toc};
}

/* Número de un artículo a partir de su título («Artículo 41», «Art 41 bis», «Artículo cuarenta y uno», «Artículo primero») */
const NUMS={uno:1,un:1,primero:1,dos:2,segundo:2,tres:3,tercero:3,cuatro:4,cuarto:4,cinco:5,quinto:5,seis:6,sexto:6,siete:7,septimo:7,ocho:8,octavo:8,nueve:9,noveno:9,diez:10,decimo:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintiun:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,trescientos:300};
function numArticulo(tit){
  const t=norm(tit).replace(/[.,]/g," ").trim(); let m=t.match(/^art(?:iculo)?\s+(\d+)\s*(bis|ter|quater)?\b/);
  if(m) return m[1]+(m[2]||"");
  m=t.match(/^articulo\s+(.+)$/); if(!m) return null;
  let n=0,suf="";m[1].split(/\s+/).forEach(w=>{if(w==="y")return;if(NUMS[w]!=null)n+=NUMS[w];else if(/^(bis|ter|quater)$/.test(w))suf=w});
  return n?String(n)+suf:null;
}
function bloqueArticulo(L,num){
  if(!L._num){L._num={};L.b.forEach(b=>{if(b[0]==="precepto"){const k=numArticulo(b[2]);if(k&&!(k in L._num))L._num[k]=b[1]}})}
  return L._num[String(num).toLowerCase()];
}
function irArticulo(art){
  if(!art) return;
  const q=$("#lq");if(q&&q.value){q.value="";buscarLey(LEYES[leyAbierta],"")}
  if(!document.getElementById("L-"+art)&&/^\d+(bis|ter|quater)?$/i.test(art)){const id=bloqueArticulo(LEYES[leyAbierta],art);if(id)art=id}
  const el=document.getElementById("L-"+art);
  if(el){
    el.scrollIntoView({block:"start"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");
    // Las fuentes y el resto del texto pueden mover el artículo al terminar de cargar: se recoloca
    const re=()=>{if(document.body.contains(el))el.scrollIntoView({block:"start"})};
    if(document.fonts&&document.fonts.status!=="loaded")document.fonts.ready.then(re);
    setTimeout(re,350);
  }
}

/* ---------- Fechas locales ---------- */
const diaLocal=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const diaDe=iso=>{const [y,m,d]=String(iso).split("-").map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5)};
const isoDe=n=>new Date(n*864e5).toISOString().slice(0,10);
const fechaLarga=n=>new Date(n*864e5).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});
const fechaCorta=n=>new Date(n*864e5).toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
const DSEM=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

/* ---------- Plan de estudio ---------- */
function planDias(p){const fin=diaDe(p.fecha),out=[];for(let d=p.inicio;d<fin;d++){if(p.dias.includes(new Date(d*864e5).getUTCDay()))out.push(d)}return out}
function planTareas(p){
  const dias=planDias(p),N=dias.length;if(!N)return [];
  const orden=p.orden==="info"?[...Array(28)].map((_,i)=>i+13).concat([...Array(12)].map((_,i)=>i+1)):[...Array(40)].map((_,i)=>i+1);
  const finD=diaDe(p.fecha);let n3=N>=6?Math.max(Math.round(N*.15),dias.filter(d=>d>=finD-14).length):Math.round(N*.15);n3=Math.min(n3,Math.max(0,N-2));
  const resto=N-n3,n1=Math.max(1,Math.round(resto*.65)),n2=Math.max(0,resto-n1);
  const out=dias.map((d,i)=>({d,fase:i<n1?1:i<n1+n2?2:3,t:[]}));
  // Fase 1: primera vuelta (leer + esquema y test de cada tema)
  orden.forEach((n,i)=>{
    out[Math.min(n1-1,Math.floor(2*i*n1/80))].t.push({k:"L"+n,t:`Leer el tema ${n} · ${TM[n].s}`,h:"#leer-"+n,a:()=>!!(S.leido||{})[n]});
    out[Math.min(n1-1,Math.floor((2*i+1)*n1/80))].t.push({k:"T"+n,t:`Esquema, tarjetas y test del tema ${n}`,h:"#tema-"+n,a:()=>S.best[n]!=null});
  });
  // Fase 2: segunda vuelta (repaso exprés + test) y un simulacro oficial por semana
  if(n2) orden.forEach((n,i)=>{out[n1+Math.min(n2-1,Math.floor(i*n2/40))].t.push({k:"R"+n,t:`Segunda vuelta del tema ${n}: repaso exprés y test`,h:"#tema-"+n,a:()=>!!(S.xp||{})[n]&&(S.xp[n]>=out[n1].d)})});
  for(let j=6;j<n2;j+=7)out[n1+j].t.push({k:"S"+out[n1+j].d,t:"Simulacro oficial (95 preguntas, 115 min)",h:"#simulacro"});
  // Fase 3: recta final
  for(let j=0;j<n3;j++){const o=out[n1+n2+j],b=ORDEN[j%ORDEN.length];
    if(j===n3-1&&n3>1){o.t.push({k:"Z"+o.d,t:"Víspera: solo repaso ligero con las reglas para recordar; prepara el DNI y bolígrafos y descansa",h:"#nemotecnias"});continue}
    if(n3>=4&&j===Math.floor(n3/2))o.t.push({k:"E"+o.d,t:"Ensayo general en papel, con el reloj (115 minutos)",h:"#ensayo"});
    else if(j%2===0)o.t.push({k:"S"+o.d,t:"Simulacro oficial (95 preguntas, 115 min)",h:"#simulacro"});
    else{o.t.push({k:"P"+o.d,t:"Preguntas trampa",h:"#trampas"});o.t.push({k:"B"+o.d,t:"Tablas para memorizar, con las respuestas ocultas",h:"#tablas"})}
    o.t.push({k:"X"+o.d,t:`Repaso exprés: ${BLOQUES[b].n}`,h:"#expres"});
    o.t.push({k:"F"+o.d,t:"Repasar «Mis fallos»",h:"#fallos",a:()=>!Object.keys(S.fail).length});
  }
  // Todos los días: tarjetas pendientes
  out.forEach(o=>o.t.push({k:"C"+o.d,t:"Repaso de tarjetas pendientes",h:"#repaso",diaria:1,a:()=>o.d===diaLocal()&&!dueCards().length}));
  return out;
}

function hoja(x,N,pen,total,qs){
  const K=x.clave.length,ans=Array(K).fill(null);let left=total,armed=false;
  const anul=x.clave.slice(0,N).split("").filter(c=>c==="X").length,cuenta=i=>i<N?x.clave[i]!=="X":i<N+anul;

  const hj=$("#hj");
  hj.addEventListener("click",e=>{const b=e.target.closest("button[data-l]");if(!b||b.disabled)return;const i=+b.dataset.i;ans[i]=ans[i]===b.dataset.l?null:b.dataset.l;
    hj.querySelectorAll(`#hq${i} button`).forEach(y=>y.classList.toggle("sel",y.dataset.l===ans[i]));$("#an").textContent=ans.slice(0,N).filter(Boolean).length});
  if(total){timer=setInterval(()=>{left--;const tm=$("#tm");if(!tm)return;tm.textContent=fmtT(left);tm.classList.toggle("low",left<=300);if(left<=0)corregir()},1000)}
  $("#sub").addEventListener("click",()=>{if(!armed){armed=true;$("#sub").textContent="Pulsa otra vez para corregir";setTimeout(()=>{armed=false;const s=$("#sub");if(s)s.textContent="Corregir"},4000);return}corregir()});
  function corregir(){

/* ---------- Historial por pregunta (estadísticas y test adaptativo) ---------- */
function registrar(id,ok){
  marcarDia();
  S.hq=S.hq||{};S.qb=S.qb||{};const d=diaLocal();
  S.sem=S.sem||{};const sm=S.sem[d]||{a:0,f:0};if(ok)sm.a++;else sm.f++;S.sem[d]=sm;if(!ok){S.failD=S.failD||{};S.failD[id]=d}
  const h=S.hq[id]||{a:0,f:0};if(ok)h.a++;else h.f++;h.d=d;S.hq[id]=h;
  const r=S.qb[id]||{b:0};const b=ok?Math.min((r.b||0)+1,5):0;S.qb[id]={b,d:d+(ok?INT[b]:0)};
}
function statsTema(){
  const H=S.hq||{},R={};TEMAS.forEach(t=>R[t.n]={a:0,f:0,q:0,tot:t.q.length});
  Object.entries(H).forEach(([id,h])=>{const n=+id.split("-")[0];if(R[n]&&!isNaN(n)){R[n].a+=h.a;R[n].f+=h.f;R[n].q++}});
  return R;
}
function prediccion(){
  const R=statsTema();let A=0,F=0;Object.values(R).forEach(r=>{A+=r.a;F+=r.f});
  const resp=A+F;if(resp<20)return null;
  const pg=(A+1)/(resp+2);let suma=0;
  TEMAS.forEach(t=>{const r=R[t.n],n=r.a+r.f;const p=n?(r.a+2*pg)/(n+2):pg;suma+=(OFICIAL.n/40)*(p-(1-p)/4)});
  let nota=Math.max(0,Math.min(10,suma/OFICIAL.n*10));
  const ofs=(S.sims||[]).filter(s=>s.o).slice(-3);
  if(ofs.length){const m=ofs.reduce((a,s)=>a+s.nota,0)/ofs.length;nota=nota*.5+m*.5}
  const conf=resp>=600||ofs.length>=3?"alta":resp>=200||ofs.length?"media":"baja";
  return {nota,conf,resp,p:pg,ofs:ofs.length};
}
const pNecesaria=nota=>Math.round((nota/10+.25)/1.25*100);
function predHTML(compacto){
  const p=prediccion();
  if(!p)return `<div class="pred"><b>Nota estimada</b><p class="muted">Responde al menos 20 preguntas (test o simulacros) para calcular tu nota estimada.</p></div>`;
  const pct=p.nota*10;
  return `<div class="pred"><div class="pred-h"><b>Nota estimada</b><span class="chip" style="--bc:var(${p.conf==="alta"?"--ok":p.conf==="media"?"--warn":"--muted"})"><i></i>fiabilidad ${p.conf}</span></div>

    ${compacto?"":`<p class="muted" style="margin:6px 0 0;font-size:13px">Calculada con tus ${p.resp} respuestas (acierto medio ${Math.round(p.p*100)} %)${p.ofs?` y tus ${p.ofs} últimos simulacros oficiales`:""}, aplicando el reparto del examen (unas 2,4 preguntas por tema) y la penalización de ¼. Para sacar un 5 necesitas acertar en torno al <b>${pNecesaria(5)} %</b> de las que respondas; para un 6, el <b>${pNecesaria(6)} %</b>; para un 7, el <b>${pNecesaria(7)} %</b>.</p>`}</div>`;

function viewAdaptativo(){
  const hoyD=diaLocal(),QB=S.qb||{},R=statsTema();
  const todas=allQs(),due=todas.filter(q=>QB[q.id]&&QB[q.id].d<=hoyD),nuevas=todas.filter(q=>!QB[q.id]);

    <div id="aq"></div></div>`;

    const bs=new Set([...main.querySelectorAll("#ab input:checked")].map(x=>x.value));if(!bs.size)return;
    const ok=q=>bs.has(TM[q.n].b);
    const pa=r=>r.a+r.f?(r.a+1)/(r.a+r.f+2):.5;
    const d1=shuffle(todas.filter(q=>ok(q)&&((QB[q.id]&&QB[q.id].d<=hoyD)||S.fail[q.id]))).sort((a,b)=>((QB[a.id]||{}).b||0)-((QB[b.id]||{}).b||0)).slice(0,12);
    const usados=new Set(d1.map(q=>q.id));

      for(const x of peso){if(!(porT[x.n]&&porT[x.n].length))continue;r-=x.w;if(r<=0){sel.push(porT[x.n].splice(Math.floor(Math.random()*porT[x.n].length),1)[0]);break}}}
    if(sel.length<20)shuffle(todas.filter(q=>ok(q)&&!sel.includes(q))).slice(0,20-sel.length).forEach(q=>sel.push(q));
    quiz($("#aq"),shuffle(sel),{onEnd:()=>{}});$("#aq").scrollIntoView({behavior:"smooth"});
  });
}

function preguntasDelDia(){
  const d=diaLocal();let x=d*9301+49297;const r=()=>(x=(x*9301+49297)%233280)/233280;
  const QB=S.qb||{},todas=allQs();
  const due=todas.filter(q=>(QB[q.id]&&QB[q.id].d<=d)||S.fail[q.id]);
  const pool=due.length>=5?due:todas;const sel=[],usados=new Set();let g=0;
  while(sel.length<5&&g++<200){const q=pool[Math.floor(r()*pool.length)];if(q&&!usados.has(q.id)){usados.add(q.id);sel.push(q)}}
  return sel;
}

  const m=tn.nodeValue.match(/^(\D*)(\d+)([\s\S]*)$/);if(!m)return;const fin=+m[2];if(fin<2)return;

function marcarDia(){S.act=S.act||{};const d=diaLocal();S.act[d]=(S.act[d]||0)+1}
function racha(){
  const A=S.act||{},hoyD=diaLocal();let d=A[hoyD]?hoyD:hoyD-1,n=0;
  while(A[d]){n++;d--}

const normTxt=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[*_`«»"]/g,"").replace(/[^a-z0-9ñ%/.,]+/g," ").trim();

function respuestasDe(){if(!_resp){_resp={};allQs().forEach(q=>{const k=normTxt(q.o[0]);(_resp[k]=_resp[k]||[]).push(q)})}return _resp}
function difPalabras(a,b){
  const A=String(a).split(/(\s+)/),B=String(b).split(/(\s+)/),n=A.length,m=B.length,T=[];
  for(let i=0;i<=n;i++){T.push(new Array(m+1).fill(0))}
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=normTxt(A[i])===normTxt(B[j])?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  let i=0,j=0,ra="",rb="",com=0;
  while(i<n&&j<m){if(normTxt(A[i])===normTxt(B[j])){ra+=esc(A[i]);rb+=esc(B[j]);if(A[i].trim())com++;i++;j++}
    else if(T[i+1][j]>=T[i][j+1]){ra+=A[i].trim()?`<mark class="dm">${esc(A[i])}</mark>`:A[i];i++}
    else{rb+=B[j].trim()?`<mark class="dp">${esc(B[j])}</mark>`:B[j];j++}}
  while(i<n){ra+=A[i].trim()?`<mark class="dm">${esc(A[i])}</mark>`:A[i];i++}
  while(j<m){rb+=B[j].trim()?`<mark class="dp">${esc(B[j])}</mark>`:B[j];j++}
  const tot=Math.max(1,Math.min(A.filter(x=>x.trim()).length,B.filter(x=>x.trim()).length));
  return {a:ra,b:rb,parecido:com/tot};
}
function fraseTemario(n,q,correcta){
  const T=typeof TEMARIO!=="undefined"&&TEMARIO[n];if(!T)return null;
  const vacias=new Set("el la los las de del y o a en un una que se por para con es son al lo su sus como más según cada este esta ser".split(" "));
  const toks=s=>normTxt(s).split(" ").filter(w=>w.length>2&&!vacias.has(w));
  const tc=new Set(toks(correcta)),tq=new Set(toks(q));if(!tc.size)return null;
  const frases=T.replace(/\[\[[^|\]]*\|([^\]]*)\]\]/g,"$1").replace(/[#>*_`|]/g," ").split(/(?<=[.:;])\s+|\n+/).map(s=>s.trim()).filter(s=>s.length>30&&s.length<420);
  let mejor=null,pm=0;
  frases.forEach(f=>{const w=new Set(toks(f));let p=0,hc=0;tc.forEach(t=>{if(w.has(t)){p+=2;hc++}});tq.forEach(t=>{if(w.has(t))p+=1});
    if(hc/tc.size<0.5)return;if(p>pm){pm=p;mejor=f}});
  return pm>=4?mejor:null;
}

/* ---------- Simulacro por bloques con el peso del temario ---------- */
function repartoBloques(bs,n){
  const tem=ORDEN.filter(b=>bs.has(b)).map(b=>({b,t:TEMAS.filter(t=>t.b===b).length}));
  const tot=tem.reduce((a,x)=>a+x.t,0);tem.forEach(x=>{x.exacto=n*x.t/tot;x.n=Math.floor(x.exacto)});
  let resto=n-tem.reduce((a,x)=>a+x.n,0);tem.slice().sort((a,b)=>(b.exacto-b.n)-(a.exacto-a.n)).forEach(x=>{if(resto>0){x.n++;resto--}});
  return tem;
}
