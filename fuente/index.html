  document.body.appendChild(p);const r=btn.getBoundingClientRect();p.style.top=Math.min(r.bottom+8,innerHeight-40)+"px";
  p.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b||b.tagName==="INPUT")return;const k=b.dataset.k;
    if(k==="cerrar"){p.remove();return}
    if(k==="reset"){S.lect={};S.rfs=1;save();el.style.setProperty("--rfs",1);lectAplicar(el);p.remove();lectPanel(btn,el);return}
    if(k==="fs"){S.rfs=+b.dataset.v;el.style.setProperty("--rfs",S.rfs)}else L[k]=k==="f"?b.dataset.v:+b.dataset.v;
    save();lectAplicar(el);b.parentElement.querySelectorAll(".chipb").forEach(x=>x.classList.toggle("on",x===b))});
  p.addEventListener("change",e=>{if(e.target.dataset.k==="foco"){L.foco=e.target.checked;save();lectAplicar(el)}});
  setTimeout(()=>document.addEventListener("click",function f(e){if(!p.isConnected){document.removeEventListener("click",f);return}if(!p.contains(e.target)&&e.target!==btn){p.remove();document.removeEventListener("click",f)}}),0);
}

/* ---------- Repaso semanal ---------- */
function semanaDatos(){
  const hoyD=diaLocal(),sem=S.sem||{},act=S.act||{},R={a:0,f:0,dias:0},P={a:0,f:0},dias=[];
  for(let k=6;k>=0;k--){const d=hoyD-k,x=sem[d]||{a:0,f:0};R.a+=x.a;R.f+=x.f;if(act[d])R.dias++;dias.push({d,a:x.a,f:x.f,act:act[d]||0})}
  for(let k=7;k<14;k++){const x=sem[hoyD-k];if(x){P.a+=x.a;P.f+=x.f}}
  const fallos=Object.entries(S.failD||{}).filter(([id,d])=>d>hoyD-7&&S.fail[id]).map(([id])=>id);
  const porTema={};fallos.forEach(id=>{const n=+id.split("-")[0];porTema[n]=(porTema[n]||0)+1});
  return {R,P,dias,fallos,porTema,hoyD};
}
function semanaClave(){const d=diaLocal(),dow=(new Date(d*864e5).getUTCDay()+6)%7;return d-dow}
function semanaInicio(){return new Date().getDay()===1&&S.semVisto!==semanaClave()}
function viewSemana(){
  S.semVisto=semanaClave();save();
  const D=semanaDatos(),{R,P}=D,pct=x=>x.a+x.f?Math.round(x.a/(x.a+x.f)*100):null,p1=pct(R),p0=pct(P);
  const f=d=>new Date(d*864e5).toLocaleDateString("es-ES",{day:"numeric",month:"short",timeZone:"UTC"});
  const max=Math.max(1,...D.dias.map(x=>x.a+x.f));
  const temas=Object.entries(D.porTema).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const dbl=debilInicio(),nd=dueCards().length,rc=racha();
  main.innerHTML=`<div class="wrap">
    <header class="th"><span class="eyebrow">Del ${f(D.hoyD-6)} al ${f(D.hoyD)}</span><h1>Tu repaso semanal</h1>
    <p class="muted" style="margin:0;max-width:64ch">Lo que has hecho en los últimos siete días, dónde has fallado y un minisimulacro de 20 preguntas con tus fallos de la semana.</p></header>
    <section class="stats">
      <div class="stat"><span class="v mono">${R.dias}<small>/7</small></span><span class="l">días con estudio</span><div class="meter"><i style="width:${R.dias/7*100}%"></i></div></div>
      <div class="stat"><span class="v mono">${R.a+R.f}</span><span class="l">preguntas respondidas${P.a+P.f?` (${R.a+R.f>=P.a+P.f?"+":""}${R.a+R.f-(P.a+P.f)} frente a la semana anterior)`:""}</span></div>
      <div class="stat"><span class="v mono">${p1==null?"–":p1+"<small>%</small>"}</span><span class="l">de acierto${p0!=null&&p1!=null?` · ${p1>=p0?"▲":"▼"} ${Math.abs(p1-p0)} puntos`:""}</span></div>
      <div class="stat"><span class="v mono">${D.fallos.length}</span><span class="l">fallos de la semana sin corregir</span></div>
    </section>
    <section class="panel"><h2 style="font-size:18px;margin-bottom:12px">Día a día</h2>
      <div class="sem-g">${D.dias.map(x=>{const n=x.a+x.f;return `<div class="sem-d" title="${f(x.d)}: ${n} respuestas, ${x.a} aciertos"><div class="sem-b"><i class="ok" style="height:${x.a/max*100}%"></i><i class="ko" style="height:${x.f/max*100}%"></i></div><span>${new Date(x.d*864e5).toLocaleDateString("es-ES",{weekday:"short",timeZone:"UTC"})}</span><small class="mono">${n||""}</small></div>`}).join("")}</div>
      <div class="heat-ley muted"><span><i style="background:var(--ok)"></i>Aciertos</span><span><i style="background:var(--bad)"></i>Fallos</span></div></section>
    <div class="home-grid">
      <section class="panel"><h2 style="font-size:18px;margin-bottom:10px">Temas con más fallos esta semana</h2>
        ${temas.length?`<div class="list">${temas.map(([n,k])=>`<a href="#tema-${n}"><span><span class="mono muted">Tema ${pad(n)}</span> · ${esc(TM[n].s)}</span><span class="mono">${k} ✗</span></a>`).join("")}</div>`:`<p class="muted" style="margin:0">Ningún fallo pendiente de esta semana. ¡Bien hecho!</p>`}</section>
      <section class="panel"><h2 style="font-size:18px;margin-bottom:10px">Para la semana que empieza</h2><div class="hoy-l">
        ${dbl?`<a class="hoy-i" href="#tema-${dbl.n}"><span class="hoy-ic">${ICON.target}</span><span class="hoy-t"><b>Refuerza el tema ${dbl.n}</b><small>${esc(dbl.s)}</small></span><span></span><span class="hoy-go">→</span></a>`:""}
        <a class="hoy-i" href="#repaso"><span class="hoy-ic">${ICON.cards}</span><span class="hoy-t"><b>Tarjetas</b><small>${nd} pendientes · también en audio</small></span><span></span><span class="hoy-go">→</span></a>
        <a class="hoy-i" href="#expres"><span class="hoy-ic">${ICON.bolt}</span><span class="hoy-t"><b>Repaso exprés</b><small>Lo que más cae, para leer o escuchar</small></span><span></span><span class="hoy-go">→</span></a>
        <a class="hoy-i" href="#logros"><span class="hoy-ic">${ICON.fuego}</span><span class="hoy-t"><b>Racha de ${rc.n} ${rc.n===1?"día":"días"}</b><small>${rc.hoy?"Hoy ya has estudiado":"Estudia hoy para no perderla"}</small></span><span></span><span class="hoy-go">→</span></a></div></section>
    </div>
    <section class="panel ofic"><div><span class="eyebrow">20 preguntas · ritmo oficial · resta ¼</span><h2>Minisimulacro de la semana</h2>
      <p class="muted" style="margin:4px 0 0">${D.fallos.length?`Con tus ${Math.min(20,D.fallos.length)} fallos de la semana${D.fallos.length<20?" y preguntas de tus temas más débiles":""}.`:"Sin fallos esta semana: preguntas de tus temas más débiles y de los que menos has practicado."}</p></div>
      <div class="row"><button class="btn pri" id="semGo">Empezar el minisimulacro</button></div></section>
  </div>`;
  $("#semGo").addEventListener("click",()=>{
    const ids=new Set(shuffle(D.fallos).slice(0,20));let pool=allQs().filter(q=>ids.has(q.id));
    if(pool.length<20){const R2=statsTema(),pc=t=>{const r=R2[t.n];return r.a+r.f?r.a/(r.a+r.f):.5};
      const orden=TEMAS.slice().sort((a,b)=>pc(a)-pc(b)).slice(0,8).map(t=>t.n),ya=new Set(pool.map(q=>q.id));
      pool=pool.concat(shuffle(allQs(t=>orden.includes(t.n)).filter(q=>!ya.has(q.id))).slice(0,20-pool.length))}
    runExam(shuffle(pool),.25,Math.round(72.6*pool.length),{})});
}

/* ---------- Fallos ---------- */
function viewFallos(){
  const ids=Object.keys(S.fail);
  const items=allQs().filter(q=>S.fail[q.id]);
  if(!items.length){
    main.innerHTML=`<div class="wrap"><header class="th"><span class="eyebrow">Repaso dirigido</span><h1>Mis fallos</h1></header>
    <div class="panel empty-state">${ICON.party}<h2>No tienes fallos pendientes</h2><p class="muted">Aquí aparecerán las preguntas que falles en los test y simulacros. Al acertarlas, salen de la lista.</p><a class="btn pri" href="#simulacro">Hacer un simulacro</a></div></div>`;
    return;
  }
  const by={}; items.forEach(q=>{by[q.n]=(by[q.n]||0)+1});
  main.innerHTML=`<div class="wrap">
    <header class="th"><span class="eyebrow">Repaso dirigido</span><h1>Mis fallos</h1>
    <p class="muted" style="margin:0">${ids.length} preguntas falladas. Cuando aciertes una, sale de la lista.</p></header>
    <div class="row"><button class="btn pri" id="goF">Practicar las ${items.length}</button><button class="btn ghost" id="clr">Vaciar la lista</button></div>
    <div class="list">${Object.keys(by).sort((a,b)=>a-b).map(n=>`<a href="#tema-${n}"><span><span class="mono muted">Tema ${String(n).padStart(2,"0")}</span> · ${esc(TM[n].s)}</span><span class="mono">${by[n]} ✗</span></a>`).join("")}</div>
    <div id="fq"></div></div>`;
  $("#goF").addEventListener("click",()=>{quiz($("#fq"),items,{onEnd:()=>{}});$("#fq").scrollIntoView({behavior:"smooth"})});
  let armed=false;
  $("#clr").addEventListener("click",e=>{if(!armed){armed=true;e.target.textContent="Pulsa otra vez para confirmar";setTimeout(()=>{armed=false;if(e.target.isConnected)e.target.textContent="Vaciar la lista"},4000);return}
    S.fail={};save();route()});
}

route();
$("#bmas").addEventListener("click",()=>{side.classList.add("open");scrim.classList.add("open")});
$("#cmdBtn").addEventListener("click",abrirPaleta);
document.querySelector(".kq").addEventListener("click",e=>{e.preventDefault();abrirPaleta()});
})();
